<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">录见产品全景：从一次操作到一份可复用教程</title>
  <desc id="desc">面向产品经理、培训讲师、客服实施和内容创作者，把软件操作录屏整理为可编辑、可复核、可交付的图文教程。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1360" y2="1780" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFCFF"/><stop offset=".55" stop-color="#F4F1FF"/><stop offset="1" stop-color="#ECFAFC"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9B82FF"/><stop offset=".55" stop-color="#7657FF"/><stop offset="1" stop-color="#4FD8EE"/></linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1ECFF"/><stop offset="1" stop-color="#E8FAFD"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#22243B" flood-opacity=".13"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2B2E48" flood-opacity=".09"/></filter>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.ink{fill:#171923}.muted{fill:#656A79}.tiny{font-size:24px;font-weight:700;letter-spacing:3px}.title{font-size:72px;font-weight:800;letter-spacing:-2px}.subtitle{font-size:34px;font-weight:500}.section{font-size:31px;font-weight:800}.cardTitle{font-size:34px;font-weight:800}.body{font-size:28px;font-weight:560}.small{font-size:24px;font-weight:560}.badge{font-size:25px;font-weight:760}</style>
  </defs>
  <rect width="1440" height="1800" fill="url(#bg)"/><circle cx="1300" cy="215" r="260" fill="#8A6BFF" opacity=".07"/><circle cx="90" cy="1640" r="250" fill="#4FD8EE" opacity=".08"/>
  <g class="sans">
    <rect x="88" y="70" width="64" height="64" rx="18" fill="#0B0D13"/><rect x="94" y="76" width="52" height="52" rx="15" fill="url(#brand)"/><path d="M113 92.5c0-4.3 4.7-7 8.4-4.7l17.1 10.7c3.4 2.1 3.4 7.1 0 9.2l-17.1 10.7c-3.7 2.3-8.4-.4-8.4-4.7V92.5Z" fill="white"/>
    <text x="174" y="99" class="ink" font-size="34" font-weight="800">录见 · RECNOTE</text><text x="174" y="130" fill="#8B90A0" class="tiny">PRODUCT LANDSCAPE / V0.1</text><text x="1298" y="110" text-anchor="end" fill="#969BA9" class="tiny">01 / 07</text>
    <text x="88" y="245" class="title ink">从一次软件操作，</text><text x="88" y="327" class="title ink">到一份可复用教程</text><text x="88" y="392" class="subtitle muted">把重复的找图、整理、复核与交付，收进同一条内容生产线。</text>
  </g>
  <g filter="url(#shadow)"><rect x="70" y="480" width="1300" height="1110" rx="38" fill="#FFF"/></g><rect x="70" y="480" width="1300" height="62" rx="38" fill="#FBFBFD"/><circle cx="114" cy="511" r="11" fill="#FF6258"/><circle cx="152" cy="511" r="11" fill="#FFBE3E"/><circle cx="190" cy="511" r="11" fill="#32C54A"/><text x="720" y="521" text-anchor="middle" class="sans" font-size="27" font-weight="650" fill="#727784">recnote · product landscape</text>
  <g class="sans">
    <text x="116" y="615" class="section ink">谁会反复遇到这件事</text><text x="1324" y="615" text-anchor="end" class="small muted">同一类劳动，不同业务场景</text>
    <g filter="url(#softShadow)"><rect x="116" y="650" width="286" height="176" rx="26" fill="#F5F2FF"/><rect x="422" y="650" width="286" height="176" rx="26" fill="#F2FAF6"/><rect x="728" y="650" width="286" height="176" rx="26" fill="#FFF8EA"/><rect x="1034" y="650" width="290" height="176" rx="26" fill="#F0F9FC"/></g>
    <circle cx="164" cy="702" r="25" fill="#7657FF"/><text x="164" y="711" text-anchor="middle" fill="white" font-size="23" font-weight="800">产</text><text x="202" y="710" class="cardTitle ink">产品经理</text><text x="146" y="763" class="small muted">功能演示 → 操作说明</text>
    <circle cx="470" cy="702" r="25" fill="#398A61"/><text x="470" y="711" text-anchor="middle" fill="white" font-size="23" font-weight="800">训</text><text x="508" y="710" class="cardTitle ink">培训讲师</text><text x="452" y="763" class="small muted">软件流程 → 课件手册</text>
    <circle cx="776" cy="702" r="25" fill="#C38923"/><text x="776" y="711" text-anchor="middle" fill="white" font-size="23" font-weight="800">服</text><text x="814" y="710" class="cardTitle ink">客服实施</text><text x="758" y="763" class="small muted">问题处理 → 标准教程</text>
    <circle cx="1082" cy="702" r="25" fill="#33899A"/><text x="1082" y="711" text-anchor="middle" fill="white" font-size="23" font-weight="800">创</text><text x="1120" y="710" class="cardTitle ink">内容创作者</text><text x="1064" y="763" class="small muted">操作录制 → 图文内容</text>
    <text x="116" y="905" class="section ink">一个输入，走向可交付结果</text>
    <g filter="url(#softShadow)"><rect x="116" y="940" width="330" height="260" rx="30" fill="#171923"/><rect x="555" y="940" width="330" height="260" rx="30" fill="url(#brandSoft)" stroke="#CFC4FF" stroke-width="2"/><rect x="994" y="940" width="330" height="260" rx="30" fill="#F6F8FC" stroke="#D7DCE6" stroke-width="2"/></g>
    <text x="150" y="988" class="tiny" fill="#9EA4B5">INPUT</text><text x="150" y="1046" class="cardTitle" fill="#FFF">软件操作录屏</text><text x="150" y="1094" class="body" fill="#C6CAD5">MOV / MP4</text><text x="150" y="1145" class="small" fill="#8F96A8">一次真实操作过程</text>
    <path d="M468 1070h65" stroke="#7657FF" stroke-width="5" stroke-linecap="round"/><path d="M520 1057l14 13-14 13" fill="none" stroke="#7657FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="978" width="260" height="56" rx="28" fill="url(#brand)"/><text x="720" y="1016" text-anchor="middle" class="badge" fill="#FFF">录见 · RECNOTE</text><text x="720" y="1080" text-anchor="middle" class="cardTitle ink">整理为教程</text><text x="720" y="1127" text-anchor="middle" class="small muted">找画面 · 组织步骤</text><text x="720" y="1162" text-anchor="middle" class="small muted">人工复核 · 安全交付</text>
    <path d="M907 1070h65" stroke="#7657FF" stroke-width="5" stroke-linecap="round"/><path d="M959 1057l14 13-14 13" fill="none" stroke="#7657FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1028" y="988" class="tiny" fill="#8B90A0">DELIVERY</text><text x="1028" y="1046" class="cardTitle ink">继续使用的内容</text><text x="1028" y="1094" class="body muted">Markdown</text><text x="1028" y="1134" class="body muted">公众号富文本</text><text x="1028" y="1174" class="body muted">独立图文包 ZIP</text>
    <text x="116" y="1294" class="section ink">真正交付的不是截图，而是四种价值</text>
    <g filter="url(#softShadow)"><rect x="116" y="1330" width="286" height="170" rx="25" fill="#F7F8FB"/><rect x="422" y="1330" width="286" height="170" rx="25" fill="#F7F8FB"/><rect x="728" y="1330" width="286" height="170" rx="25" fill="#F7F8FB"/><rect x="1034" y="1330" width="290" height="170" rx="25" fill="#F7F8FB"/></g>
    <text x="146" y="1385" class="cardTitle ink">少回放</text><text x="146" y="1431" class="small muted">减少反复暂停找画面</text><text x="452" y="1385" class="cardTitle ink">可编辑</text><text x="452" y="1431" class="small muted">标题、说明、顺序可改</text><text x="758" y="1385" class="cardTitle ink">可复核</text><text x="758" y="1431" class="small muted">文字、截图、隐私有门禁</text><text x="1064" y="1385" class="cardTitle ink">可交付</text><text x="1064" y="1431" class="small muted">多种格式继续复用</text>
  </g>
  <g class="sans"><text x="88" y="1662" class="section ink">PRODUCT VIEW</text><text x="88" y="1710" class="small muted">先回答“为谁解决什么”，再讨论系统如何实现。</text><text x="1352" y="1710" text-anchor="end" class="tiny" fill="#9BA0AE">RECNOTE / 2026</text></g>
</svg>
