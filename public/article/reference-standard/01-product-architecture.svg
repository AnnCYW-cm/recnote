<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">录见 V0.1 产品全景架构</title>
  <desc id="desc">真实录屏经本地媒体处理得到候选画面；规划中的语义层尚未接入；Web 教程工作台目前使用预置自有案例完成编辑、复核与导出。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1360" y2="1760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFBFF"/>
      <stop offset="0.54" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EEF9FB"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9B82FF"/>
      <stop offset="0.55" stop-color="#7657FF"/>
      <stop offset="1" stop-color="#4FD8EE"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4FBF7"/>
      <stop offset="1" stop-color="#EAF7F0"/>
    </linearGradient>
    <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#EEEBFF"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#FFF2D8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#22243B" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2B2E48" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .ink { fill: #171923; }
      .muted { fill: #656A79; }
      .tiny { font-size: 24px; font-weight: 700; letter-spacing: 3px; }
      .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 34px; font-weight: 500; }
      .cardTitle { font-size: 46px; font-weight: 800; }
      .body { font-size: 36px; font-weight: 520; }
      .small { font-size: 31px; font-weight: 600; }
      .badge { font-size: 28px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1440" height="1800" fill="url(#bg)"/>
  <circle cx="1300" cy="220" r="260" fill="#8A6BFF" opacity="0.07"/>
  <circle cx="110" cy="1640" r="250" fill="#4FD8EE" opacity="0.08"/>

  <!-- Brand header -->
  <g class="sans">
    <rect x="88" y="70" width="64" height="64" rx="18" fill="#0B0D13"/>
    <rect x="94" y="76" width="52" height="52" rx="15" fill="url(#brand)"/>
    <path d="M113 92.5c0-4.3 4.7-7 8.4-4.7l17.1 10.7c3.4 2.1 3.4 7.1 0 9.2l-17.1 10.7c-3.7 2.3-8.4-.4-8.4-4.7V92.5Z" fill="white"/>
    <text x="174" y="99" class="ink" font-size="34" font-weight="800">录见 · RECNOTE</text>
    <text x="174" y="130" fill="#8B90A0" class="tiny">PRODUCT ARCHITECTURE / V0.1</text>
    <text x="1298" y="110" text-anchor="end" fill="#969BA9" class="tiny">01 / 03</text>

    <text x="88" y="250" class="title ink">把录屏拆成一条</text>
    <text x="88" y="334" class="title ink">可复核的教程生产线</text>
    <text x="88" y="397" class="subtitle muted">两端已经能跑；真正缺的是中间的语义转换。</text>

    <!-- Status legend -->
    <g transform="translate(88 438)">
      <rect width="246" height="56" rx="28" fill="#EAF7F0" stroke="#B9DECA"/>
      <circle cx="28" cy="28" r="8" fill="#398A61"/>
      <text x="50" y="38" class="badge" fill="#2F7252">已完成 · REAL</text>
    </g>
    <g transform="translate(352 438)">
      <rect width="270" height="56" rx="28" fill="#F0ECFF" stroke="#CFC4FF"/>
      <circle cx="28" cy="28" r="8" fill="#7657FF"/>
      <text x="50" y="38" class="badge" fill="#6245D7">已完成 · DEMO</text>
    </g>
    <g transform="translate(640 438)">
      <rect width="230" height="56" rx="28" fill="#FFF2D8" stroke="#E9C986" stroke-dasharray="8 7"/>
      <circle cx="28" cy="28" r="8" fill="#BC7A10"/>
      <text x="50" y="38" class="badge" fill="#9C640B">规划中 · NEXT</text>
    </g>
  </g>

  <!-- Main Mac window -->
  <g filter="url(#shadow)">
    <rect x="70" y="535" width="1300" height="1100" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="535" width="1300" height="94" rx="40" fill="#FBFBFD"/>
  <path d="M70 594h1300" stroke="#E7E8EE" stroke-width="2"/>
  <circle cx="116" cy="582" r="12" fill="#FF6258"/>
  <circle cx="154" cy="582" r="12" fill="#FFBE3E"/>
  <circle cx="192" cy="582" r="12" fill="#32C54A"/>
  <text x="720" y="590" text-anchor="middle" class="sans small" fill="#777C89">recnote-v0.1 · current product map</text>

  <!-- Input source -->
  <g class="sans" filter="url(#softShadow)">
    <rect x="120" y="676" width="1200" height="150" rx="28" fill="#151721"/>
    <rect x="154" y="714" width="76" height="76" rx="22" fill="url(#brand)"/>
    <path d="M179 731c0-3.8 4.2-6.2 7.4-4.2l22.8 14.3c3 1.9 3 6.3 0 8.2l-22.8 14.3c-3.2 2-7.4-.4-7.4-4.2V731Z" fill="white"/>
    <text x="266" y="733" class="small" fill="#A9AFBE">INPUT · OWNED RECORDING</text>
    <text x="266" y="786" class="cardTitle" fill="#FFFFFF">自有软件操作录屏</text>
    <text x="1268" y="759" text-anchor="end" class="body" fill="#D7DAE3">MOV / MP4 · 17.83 秒样本</text>
  </g>

  <!-- Cards -->
  <g class="sans">
    <!-- Media card -->
    <g filter="url(#softShadow)">
      <rect x="120" y="920" width="360" height="490" rx="30" fill="url(#greenSoft)" stroke="#B8D9C7" stroke-width="2"/>
    </g>
    <rect x="148" y="950" width="204" height="54" rx="27" fill="#DDF2E6"/>
    <text x="174" y="987" class="badge" fill="#2F7252">已完成 · POC</text>
    <text x="148" y="1065" class="cardTitle ink">01  媒体处理</text>
    <text x="148" y="1126" class="body muted">读取元数据</text>
    <text x="148" y="1180" class="body muted">Scene + MAD</text>
    <text x="148" y="1234" class="body muted">覆盖补帧 / 相邻去重</text>
    <path d="M148 1276h304" stroke="#C7DED1" stroke-width="2"/>
    <text x="148" y="1328" class="small" fill="#2F7252">7 张候选画面</text>
    <text x="148" y="1370" class="small" fill="#2F7252">review.html</text>

    <!-- Semantic card -->
    <g filter="url(#softShadow)">
      <rect x="540" y="920" width="360" height="490" rx="30" fill="url(#amberSoft)" stroke="#D7A94E" stroke-width="3" stroke-dasharray="14 12"/>
    </g>
    <rect x="568" y="950" width="174" height="54" rx="27" fill="#FCE6B8"/>
    <text x="594" y="987" class="badge" fill="#9C640B">规划中</text>
    <text x="568" y="1065" class="cardTitle ink">02  语义理解</text>
    <text x="568" y="1126" class="body muted">选择 / 合并候选</text>
    <text x="568" y="1180" class="small muted">语义理解（方案待验证）</text>
    <text x="568" y="1234" class="body muted">生成标题与说明</text>
    <path d="M568 1276h304" stroke="#E7CF9A" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="568" y="1328" class="small" fill="#9C640B">尚未实现</text>
    <text x="568" y="1370" class="small" fill="#9C640B">尚未自动接入</text>

    <!-- Delivery card -->
    <g filter="url(#softShadow)">
      <rect x="960" y="920" width="360" height="490" rx="30" fill="url(#purpleSoft)" stroke="#CFC4FF" stroke-width="2"/>
    </g>
    <rect x="988" y="950" width="236" height="54" rx="27" fill="#E8E2FF"/>
    <text x="1014" y="987" class="badge" fill="#6245D7">已完成 · DEMO</text>
    <text x="988" y="1065" class="cardTitle ink">03  教程交付</text>
    <text x="988" y="1126" class="body muted">编辑 / 排序 / 隐藏</text>
    <text x="988" y="1180" class="body muted">复核与隐私门禁</text>
    <text x="988" y="1234" class="body muted">Markdown / HTML / ZIP</text>
    <path d="M988 1276h304" stroke="#D8D0FA" stroke-width="2"/>
    <text x="988" y="1328" class="small" fill="#6245D7">预置 6 步自有初稿</text>
    <text x="988" y="1370" class="small" fill="#6245D7">浏览器本地导出</text>

    <!-- Deliberately disconnected arrows -->
    <path d="M485 1148h38" stroke="#BC7A10" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M512 1138l12 10-12 10" fill="none" stroke="#BC7A10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="445" y="852" width="130" height="44" rx="22" fill="#FFF1CF"/>
    <text x="510" y="882" text-anchor="middle" class="badge" fill="#9C640B">未接通</text>

    <path d="M905 1148h38" stroke="#BC7A10" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M932 1138l12 10-12 10" fill="none" stroke="#BC7A10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="865" y="852" width="130" height="44" rx="22" fill="#FFF1CF"/>
    <text x="930" y="882" text-anchor="middle" class="badge" fill="#9C640B">未接通</text>

    <!-- Boundary strip -->
    <rect x="120" y="1470" width="1200" height="112" rx="26" fill="#F3F4F8"/>
    <circle cx="170" cy="1526" r="20" fill="#151721"/>
    <path d="M162 1526l7 7 12-16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="1516" class="small ink">V0.1 的真实边界</text>
    <text x="210" y="1558" class="small muted">CLI 真实读取视频；Web 只使用预置自有案例，不读取也不上传视频字节。</text>
  </g>

  <!-- Footer -->
  <g class="sans">
    <text x="88" y="1710" class="small" fill="#303443">TODAY</text>
    <text x="230" y="1710" class="small muted">两端独立运行</text>
    <text x="576" y="1710" class="small" fill="#9C640B">NEXT</text>
    <text x="692" y="1710" class="small muted">只接中间这座语义桥</text>
    <text x="1352" y="1710" text-anchor="end" class="tiny" fill="#9BA0AE">RECNOTE / 2026</text>
  </g>
</svg>
