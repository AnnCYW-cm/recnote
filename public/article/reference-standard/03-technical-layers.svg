<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">录见 V0.1 技术分层架构</title>
  <desc id="desc">从浏览器教程工作台、规划中的语义转换、数据契约、本地媒体处理到验证与安全，明确每一层当前状态。</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1370" y2="1770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFCFF"/>
      <stop offset="0.54" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EEF9FB"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9B82FF"/>
      <stop offset="0.55" stop-color="#7657FF"/>
      <stop offset="1" stop-color="#4FD8EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#22243B" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2B2E48" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .ink { fill: #171923; }
      .muted { fill: #656A79; }
      .tiny { font-size: 24px; font-weight: 700; letter-spacing: 3px; }
      .title { font-size: 70px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 34px; font-weight: 500; }
      .layerNo { font-size: 23px; font-weight: 800; letter-spacing: 1.5px; }
      .layerTitle { font-size: 38px; font-weight: 820; }
      .body { font-size: 32px; font-weight: 610; }
      .badge { font-size: 27px; font-weight: 760; }
      .small { font-size: 30px; font-weight: 620; }
    </style>
  </defs>

  <rect width="1440" height="1800" fill="url(#bg)"/>
  <circle cx="1310" cy="220" r="260" fill="#7657FF" opacity="0.07"/>
  <circle cx="100" cy="1610" r="240" fill="#4FD8EE" opacity="0.08"/>

  <!-- Brand header -->
  <g class="sans">
    <rect x="88" y="70" width="64" height="64" rx="18" fill="#0B0D13"/>
    <rect x="94" y="76" width="52" height="52" rx="15" fill="url(#brand)"/>
    <path d="M113 92.5c0-4.3 4.7-7 8.4-4.7l17.1 10.7c3.4 2.1 3.4 7.1 0 9.2l-17.1 10.7c-3.7 2.3-8.4-.4-8.4-4.7V92.5Z" fill="white"/>
    <text x="174" y="99" class="ink" font-size="34" font-weight="800">录见 · RECNOTE</text>
    <text x="174" y="130" fill="#8B90A0" class="tiny">TECHNICAL LAYERS / V0.1</text>
    <text x="1298" y="110" text-anchor="end" fill="#969BA9" class="tiny">03 / 03</text>

    <text x="88" y="250" class="title ink">五层技术架构，</text>
    <text x="88" y="332" class="title ink">完成度必须一眼看清</text>
    <text x="88" y="397" class="subtitle muted">不是把工具堆在一起，而是让输入、证据、复核与交付持续可追溯。</text>
  </g>

  <!-- Main Mac window -->
  <g filter="url(#shadow)">
    <rect x="70" y="478" width="1300" height="1154" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="478" width="1300" height="90" rx="40" fill="#FBFBFD"/>
  <path d="M70 536h1300" stroke="#E7E8EE" stroke-width="2"/>
  <circle cx="116" cy="524" r="12" fill="#FF6258"/>
  <circle cx="154" cy="524" r="12" fill="#FFBE3E"/>
  <circle cx="192" cy="524" r="12" fill="#32C54A"/>
  <text x="720" y="532" text-anchor="middle" class="sans small" fill="#777C89">recnote-v0.1 · implementation layers</text>

  <g class="sans">
    <!-- Layer 5 -->
    <g filter="url(#softShadow)">
      <rect x="110" y="604" width="1220" height="172" rx="28" fill="#F6F3FF" stroke="#CFC4FF" stroke-width="2"/>
    </g>
    <rect x="138" y="632" width="270" height="116" rx="22" fill="#7657FF"/>
    <text x="166" y="675" class="layerNo" fill="#DED7FF">L5 · DELIVERY</text>
    <text x="166" y="724" class="layerTitle" fill="#FFFFFF">教程交付层</text>
    <text x="440" y="655" class="body ink">React + TypeScript · 浏览器工作台</text>
    <text x="440" y="704" class="body muted">编辑排序 · 文案复核 · 隐私门禁 · MD / HTML / ZIP</text>
    <rect x="1080" y="628" width="220" height="52" rx="26" fill="#E5DFFF"/>
    <text x="1190" y="664" text-anchor="middle" class="badge" fill="#6245D7">已完成 · DEMO</text>

    <!-- Layer 4 -->
    <g filter="url(#softShadow)">
      <rect x="110" y="798" width="1220" height="172" rx="28" fill="#FFF8EA" stroke="#D7A94E" stroke-width="3" stroke-dasharray="14 12"/>
    </g>
    <rect x="138" y="826" width="270" height="116" rx="22" fill="#C38923"/>
    <text x="166" y="869" class="layerNo" fill="#FFF0C9">L4 · SEMANTIC</text>
    <text x="166" y="918" class="layerTitle" fill="#FFFFFF">语义转换层</text>
    <text x="440" y="849" class="body ink">规则 / OCR / 多模态待评估</text>
    <text x="440" y="898" class="body muted">生成步骤标题、说明与来源关系</text>
    <rect x="1114" y="822" width="186" height="52" rx="26" fill="#FCE6B8"/>
    <text x="1207" y="858" text-anchor="middle" class="badge" fill="#9C640B">规划中</text>
    <text x="440" y="940" class="small" fill="#9C640B">尚未实现 · 尚未接通上下两端</text>

    <!-- Layer 3 -->
    <g filter="url(#softShadow)">
      <rect x="110" y="992" width="1220" height="172" rx="28" fill="#F6F8FC" stroke="#C8CEDA" stroke-width="2"/>
    </g>
    <rect x="138" y="1020" width="270" height="116" rx="22" fill="#4D5566"/>
    <text x="166" y="1063" class="layerNo" fill="#DDE2EC">L3 · CONTRACT</text>
    <text x="166" y="1112" class="layerTitle" fill="#FFFFFF">数据契约层</text>
    <text x="440" y="1043" class="body ink">metadata.json · candidates.json</text>
    <text x="440" y="1092" class="body muted">candidates[] 与 TutorialStep[] 两端结构已存在</text>
    <rect x="1060" y="1016" width="240" height="52" rx="26" fill="#E5E8EF"/>
    <text x="1180" y="1052" text-anchor="middle" class="badge" fill="#4D5566">两端结构已存在</text>
    <text x="440" y="1134" class="small" fill="#7A5A18">桥接契约未定义 · 转换逻辑未实现</text>

    <!-- Layer 2 -->
    <g filter="url(#softShadow)">
      <rect x="110" y="1186" width="1220" height="172" rx="28" fill="#F2FAF6" stroke="#B8D9C7" stroke-width="2"/>
    </g>
    <rect x="138" y="1214" width="270" height="116" rx="22" fill="#398A61"/>
    <text x="166" y="1257" class="layerNo" fill="#DDF2E6">L2 · MEDIA</text>
    <text x="166" y="1306" class="layerTitle" fill="#FFFFFF">媒体处理层</text>
    <text x="440" y="1237" class="body ink">Python 标准库 + ffmpeg / ffprobe</text>
    <text x="440" y="1286" class="body muted">PTS · Scene score · MAD · 覆盖补帧 · 局部去重</text>
    <rect x="1072" y="1210" width="228" height="52" rx="26" fill="#DDF2E6"/>
    <text x="1186" y="1246" text-anchor="middle" class="badge" fill="#2F7252">已完成 · POC</text>
    <text x="440" y="1328" class="small" fill="#2F7252">真实录屏 → 7 张候选 + 离线评审页</text>

    <!-- Layer 1 -->
    <g filter="url(#softShadow)">
      <rect x="110" y="1380" width="1220" height="172" rx="28" fill="#F5FAFB" stroke="#B8DDE3" stroke-width="2"/>
    </g>
    <rect x="138" y="1408" width="270" height="116" rx="22" fill="#347F8C"/>
    <text x="166" y="1451" class="layerNo" fill="#DDF5F8">L1 · EVIDENCE</text>
    <text x="166" y="1500" class="layerTitle" fill="#FFFFFF">验证与安全层</text>
    <text x="440" y="1431" class="body ink">离线优先 · 默认 unreviewed · 输出目录保护</text>
    <text x="440" y="1480" class="body muted">CLI 18/18 · Web 检查通过 · E2E 4/4</text>
    <rect x="1060" y="1404" width="240" height="52" rx="26" fill="#DDF5F8"/>
    <text x="1180" y="1440" text-anchor="middle" class="badge" fill="#347F8C">持续验证</text>
    <text x="440" y="1522" class="small" fill="#347F8C">CLI 不调用模型 API，也不发起网络请求</text>
  </g>

  <!-- Footer -->
  <g class="sans">
    <text x="88" y="1710" class="small" fill="#303443">LOCAL FIRST</text>
    <text x="306" y="1710" class="small muted">先把候选证据做可靠，再接语义层。</text>
    <text x="1352" y="1710" text-anchor="end" class="tiny" fill="#9BA0AE">RECNOTE / 2026</text>
  </g>
</svg>
