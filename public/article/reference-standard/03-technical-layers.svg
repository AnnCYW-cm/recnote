<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">录见真实组件依赖图</title>
  <desc id="desc">从本地 CLI 模块到 metadata、candidates 和 review 输出，再经过尚未实现的转换器进入 TutorialStep 与 Web 状态机和导出。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1360" y2="1780" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFCFF"/><stop offset=".55" stop-color="#F4F1FF"/><stop offset="1" stop-color="#ECFAFC"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9B82FF"/><stop offset=".55" stop-color="#7657FF"/><stop offset="1" stop-color="#4FD8EE"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#22243B" flood-opacity=".13"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2B2E48" flood-opacity=".08"/></filter>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.ink{fill:#171923}.muted{fill:#656A79}.tiny{font-size:24px;font-weight:700;letter-spacing:3px}.title{font-size:70px;font-weight:800;letter-spacing:-2px}.subtitle{font-size:34px;font-weight:500}.section{font-size:36px;font-weight:820}.body{font-size:32px;font-weight:650}.small{font-size:27px;font-weight:600}.badge{font-size:28px;font-weight:760}.cardtag{font-size:28px;font-weight:780}.cardbody{font-size:32px;font-weight:720}.cardsmall{font-size:27px;font-weight:600}.file{font-size:34px;font-weight:760}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <rect width="1440" height="1800" fill="url(#bg)"/><circle cx="1310" cy="220" r="260" fill="#7657FF" opacity=".07"/><circle cx="100" cy="1610" r="240" fill="#4FD8EE" opacity=".08"/>
  <g class="sans">
    <rect x="88" y="70" width="64" height="64" rx="18" fill="#0B0D13"/><rect x="94" y="76" width="52" height="52" rx="15" fill="url(#brand)"/><path d="M113 92.5c0-4.3 4.7-7 8.4-4.7l17.1 10.7c3.4 2.1 3.4 7.1 0 9.2l-17.1 10.7c-3.7 2.3-8.4-.4-8.4-4.7V92.5Z" fill="white"/>
    <text x="174" y="99" class="ink" font-size="34" font-weight="800">录见 · RECNOTE</text><text x="174" y="130" fill="#8B90A0" class="tiny">COMPONENT DEPENDENCY / V0.1</text><text x="1298" y="110" text-anchor="end" fill="#969BA9" class="tiny">03 / 07</text>
    <text x="88" y="245" class="title ink">真实组件如何连接，</text><text x="88" y="327" class="title ink">缺口就画在哪里</text><text x="88" y="392" class="subtitle muted">从代码模块、数据产物到状态机与导出，依赖关系必须可追溯。</text>
  </g>
  <g filter="url(#shadow)"><rect x="70" y="470" width="1300" height="1130" rx="38" fill="#FFF"/></g><rect x="70" y="470" width="1300" height="62" rx="38" fill="#FBFBFD"/><circle cx="114" cy="501" r="11" fill="#FF6258"/><circle cx="152" cy="501" r="11" fill="#FFBE3E"/><circle cx="190" cy="501" r="11" fill="#32C54A"/><text x="720" y="511" text-anchor="middle" class="sans" font-size="27" font-weight="650" fill="#727784">recnote · implementation dependency</text>
  <g class="sans">
    <circle cx="117" cy="575" r="8" fill="#398A61"/><text x="136" y="584" class="small" fill="#2F7252">已实现</text><circle cx="280" cy="575" r="8" fill="#C38923"/><text x="299" y="584" class="small" fill="#9C640B">待实现</text><text x="1322" y="584" text-anchor="end" class="small muted">箭头表示真实依赖，不表示未来承诺</text>

    <g filter="url(#softShadow)"><rect x="110" y="620" width="1220" height="245" rx="28" fill="#F2FAF6" stroke="#B8D9C7" stroke-width="2"/></g>
    <rect x="138" y="650" width="250" height="185" rx="23" fill="#398A61"/><text x="160" y="697" class="tiny" fill="#DDF2E6">LOCAL CLI</text><text x="160" y="752" class="body" fill="#FFF">媒体处理模块</text><text x="160" y="803" class="cardsmall" fill="#DDF2E6">离线已实现</text>
    <g filter="url(#softShadow)"><rect x="408" y="650" width="420" height="82" rx="20" fill="#FFF"/><rect x="850" y="650" width="450" height="82" rx="20" fill="#FFF"/><rect x="408" y="750" width="420" height="82" rx="20" fill="#FFF"/><rect x="850" y="750" width="450" height="82" rx="20" fill="#FFF"/></g>
    <text x="430" y="702" class="cardtag" fill="#2F7252">01 · 读取</text><text x="590" y="702" class="cardbody ink">ffprobe</text>
    <text x="872" y="702" class="cardtag" fill="#2F7252">02 · 检测</text><text x="1032" y="702" class="cardbody ink">scene + MAD</text>
    <text x="430" y="802" class="cardtag" fill="#2F7252">03 · 筛选</text><text x="590" y="802" class="cardbody ink">cluster + dedup</text>
    <text x="872" y="802" class="cardtag" fill="#2F7252">04 · 截图</text><text x="1032" y="802" class="cardbody ink">ffmpeg</text>

    <path d="M720 865v35" stroke="#398A61" stroke-width="5" stroke-linecap="round"/><path d="M706 888l14 14 14-14" fill="none" stroke="#398A61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#softShadow)"><rect x="110" y="900" width="1220" height="200" rx="28" fill="#F6F8FC" stroke="#C8CEDA" stroke-width="2"/></g>
    <text x="140" y="947" class="tiny" fill="#72798A">CLI OUTPUTS</text><text x="370" y="950" class="section ink">可检查的数据与人工评审入口</text>
    <rect x="140" y="970" width="360" height="100" rx="19" fill="#FFF"/><rect x="530" y="970" width="360" height="100" rx="19" fill="#FFF"/><rect x="920" y="970" width="380" height="100" rx="19" fill="#FFF"/>
    <text x="320" y="1012" text-anchor="middle" class="file mono ink">metadata.json</text><text x="320" y="1052" text-anchor="middle" class="cardsmall muted">媒体事实</text><text x="710" y="1012" text-anchor="middle" class="file mono ink">candidates.json</text><text x="710" y="1052" text-anchor="middle" class="cardsmall muted">候选与来源</text><text x="1110" y="1012" text-anchor="middle" class="file mono ink">review.html</text><text x="1110" y="1052" text-anchor="middle" class="cardsmall muted">人工评审入口</text>

    <path d="M720 1100v30" stroke="#BC7A10" stroke-width="5" stroke-dasharray="10 9"/><path d="M706 1118l14 14 14-14" fill="none" stroke="#BC7A10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#softShadow)"><rect x="110" y="1130" width="1220" height="190" rx="28" fill="#FFF8EA" stroke="#D7A94E" stroke-width="3" stroke-dasharray="14 12"/></g>
    <rect x="138" y="1158" width="290" height="135" rx="22" fill="#C38923"/><text x="166" y="1200" class="tiny" fill="#FFF0C9">MISSING BRIDGE</text><text x="166" y="1244" class="body" fill="#FFF">候选到步骤转换器</text>
    <text x="460" y="1188" class="section ink">Candidate → TutorialStep</text><text x="460" y="1235" class="body" fill="#9C640B">契约未定义 · 转换逻辑未实现</text><text x="460" y="1280" class="small muted">规则 / OCR / 多模态方案仍待真实样本评估</text>

    <path d="M720 1320v30" stroke="#7657FF" stroke-width="5" stroke-dasharray="10 9"/><path d="M706 1338l14 14 14-14" fill="none" stroke="#7657FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#softShadow)"><rect x="110" y="1350" width="1220" height="220" rx="28" fill="#F5F2FF" stroke="#CFC4FF" stroke-width="2"/></g>
    <rect x="138" y="1380" width="250" height="160" rx="22" fill="#7657FF"/><text x="166" y="1425" class="tiny" fill="#E7E1FF">WEB DEMO</text><text x="166" y="1478" class="section" fill="#FFF">教程状态机</text><text x="166" y="1520" class="small" fill="#E7E1FF">独立 Demo</text>
    <rect x="408" y="1386" width="310" height="82" rx="18" fill="#FFF"/><rect x="750" y="1386" width="230" height="82" rx="18" fill="#FFF"/><rect x="1012" y="1386" width="288" height="82" rx="18" fill="#FFF"/>
    <text x="563" y="1438" text-anchor="middle" class="file mono ink">TutorialStep[]</text><text x="865" y="1438" text-anchor="middle" class="cardtag ink">编辑 / 复核</text><text x="1156" y="1438" text-anchor="middle" class="cardtag ink">MD / 富文本 / ZIP</text>
    <path d="M718 1427h32M980 1427h32" stroke="#7657FF" stroke-width="5"/>
    <text x="563" y="1518" text-anchor="middle" class="cardsmall muted">预置步骤</text><text x="865" y="1518" text-anchor="middle" class="cardsmall" fill="#6245D7">人工门禁</text><text x="1156" y="1518" text-anchor="middle" class="cardsmall" fill="#6245D7">检查通过后导出</text>
  </g>
  <g class="sans"><text x="88" y="1672" class="section ink">IMPLEMENTATION VIEW</text><text x="88" y="1720" class="small muted">绿色为真实组件，橙色为唯一缺口，紫色为独立 Web 状态机。</text><text x="1352" y="1720" text-anchor="end" class="tiny" fill="#9BA0AE">RECNOTE / 2026</text></g>
</svg>
